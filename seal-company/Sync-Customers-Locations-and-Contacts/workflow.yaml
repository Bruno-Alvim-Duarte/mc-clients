workflow:
  name: Acumatica to HubSpot - Sync Customers, Locations and Contacts
  id: D19fDl2itAOT
  version: draft
  isActive: false
  publishedOn: 2026-06-03T15:13:28.000Z
triggers:
  - name: Schedule - Run daily, only on weekdays
    type: schedule
    message: Run daily, only on weekdays
    schedule:
      mode: interval
      days:
        - 1
        - 2
        - 3
        - 4
        - 5
      dayNames:
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
      intervalMs: 86400000
steps:
  - stepNumber: 1
    name: Map - Build Acumatica Date Filter
    input: ErRukEcIAiti
    type: map
    code: |-
      // Get the last synced date from memory
      const lastSyncedDate = input.memory?.LastSyncedDate;

      // Get current timestamp in ISO 8601 format
      const currentTimestamp = new Date().toISOString();

      let filterUsed;

      // Check if lastSyncedDate exists and is not null, undefined, or empty
      if (lastSyncedDate != null && lastSyncedDate !== '') {
        // Set filter with the last synced date
        filterUsed = "LastModifiedDateTime gt datetimeoffset'" + lastSyncedDate + "'";
      } else {
        // Set empty filter string
        filterUsed = "";
      }

      return [{ 
        filter: filterUsed,
        syncStartedAt: currentTimestamp,
      }];
  - stepNumber: 2
    name: Acumatica - Fetch Acumatica Customers
    type: action
    pagination:
      page: "0"
      pageSize: 50
    args:
      - label: Endpoint Version
        value: 1.0.0
      - label: Filter
        value: "[Step 1: data[0].filter]"
      - label: Web Service Endpoint
        value: MindCloudIntegration
      - label: Expand
        value: MainContact, MainContact/Address
    children:
      - stepNumber: 3
        name: Map - Count Customers to Sync
        input: Step 2
        type: map
        code: |-
          // Get the customers array from the input step
          const customers = input.acumaticaSearchByEntitySNHC;

          // Count the number of customers
          const customerCount = customers?.length || 0;

          // Return the count in an array with a single object
          return [{ customerCount }];
      - stepNumber: 4
        name: "If/Else - If: No Customers to Sync?"
        type: conditional
        condition: "[Step 3: input[0].data[0].customerCount] = 0"
      - stepNumber: 6
        name: "Flow Control - LOG: Sync started"
        type: action
        args:
          - label: Action
            value: doNothing
          - label: Emit Log
            value: Yes
          - label: Log Type
            value: info
          - label: Log Message
            value: "[SYNC_STARTED] syncStartedAt: "
      - stepNumber: 7
        name: "Iterate - Loop: Each Customer"
        type: loop
        loopTarget:
          stepNumber: 2
          name: Acumatica - Fetch Acumatica Customers
        children:
          - stepNumber: 8
            name: Function - Search for Companies Matches
            type: action
            args:
              - label: Acumatica Customer
                value: "[Step 7: input]"
          - stepNumber: 9
            name: "If/Else - If: Company Match is Ambiguous?"
            type: conditional
            condition: "[Step 8: input[0].status] = ambiguous_match"
          - stepNumber: 44
            name: Map - Build Customer Summary
            input: Step 7, Step 8, Step 13, Step 14, Step 25, Step 35, Step 36, Step 40
            type: map
            code: |-
              // Customer info
              const customer = input.iterateEIVA?.[0];
              const customerId = customer?.customerID?.value || 'unknown';
              const customerName = customer?.customerName?.value || 'unknown';

              // Company match result
              const match = input.functionRGEY?.[0];
              const matchStatus = match?.status || 'no_match';
              const hubspotCompanyId = match?.hubspotCompanyId || 'none';
              const confidence = match?.confidenceScore || 0;

              // Determine what happened
              let companyAction, parentId;
              if (matchStatus === 'ambiguous_match') {
                // Ambiguous — was skipped by the ambiguous check
                companyAction = 'SKIPPED (ambiguous)';
                parentId = hubspotCompanyId;
              } else if (matchStatus === 'matched_by_id' || matchStatus === 'matched_by_confidence') {
                // Confident match — updated
                companyAction = 'UPDATED';
                parentId = hubspotCompanyId;
              } else {
                // No match — created new
                companyAction = 'CREATED';
                parentId = input.hubspotAppCreateCompanyNKG5?.[0]?.id || 'failed';
              }

              // Location counts (from whichever branch ran)
              const locsThen = input.acumaticaSearchByEntity2JBY;
              const locsElse = input.acumaticaSearchByEntityLAR2;
              const locationCount = locsThen?.length || locsElse?.length || 0;

              // Contact counts (from whichever branch ran)
              const contactsThen = input.acumaticaSearchByEntityD3IZ;
              const contactsElse = input.acumaticaSearchByEntity7PE2;
              const contactCount = contactsThen?.length || contactsElse?.length || 0;

              // Build summary
              const summary = `[CUSTOMER] ${customerId} (${customerName}) | company: ${companyAction} | confidence: ${confidence} | hubspotId: ${parentId} | locations: ${locationCount} | contacts: ${contactCount}`;

              return [{ summary }];
          - stepNumber: 45
            name: "Flow Control - LOG: Customer Summary"
            type: action
            args:
              - label: Action
                value: doNothing
              - label: Emit Log
                value: "true"
              - label: Log Type
                value: info
              - label: Log Message
                value: "[Step 44: data[0].summary]"
          - stepNumber: 46
            name: "Flow Control - LOG: Sync Completed"
            type: action
            args:
              - label: Action
                value: doNothing
              - label: Emit Log
                value: "true"
              - label: Log Type
                value: info
              - label: Log Message
                value: "[SYNC_COMPLETED] syncStartedAt="
          - stepNumber: 47
            name: If/Else - If Customer Count < 50
            type: conditional
            condition: "[Step 3: input[0].customerCount] < 50"
  - stepNumber: 5
    name: "Flow Control - LOG: Nothing to Sync — Exit Early"
    type: action
    args:
      - label: Action
        value: endAsSuccess
      - label: Emit Log
        value: "true"
      - label: Log Type
        value: info
      - label: Log Message
        value: "[SYNC_COMPLETED] No customers modified since last sync. Filter used: "
      - label: Send Email
        value: "false"
