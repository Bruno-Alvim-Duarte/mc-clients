    code: |-
      // Helper function to convert null/undefined to empty string
      const safeValue = (value) => value ?? '';

      // Get values from input data
      const parentName = input.functionRGEY?.[0]?.hubspotCompany?.properties?.name;
      const locationName = input.iterate9TK8?.[0]?.locationName?.value;
