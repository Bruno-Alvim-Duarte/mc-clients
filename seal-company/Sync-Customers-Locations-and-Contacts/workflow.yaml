    children:
      - stepNumber: 27
        name: Function - Acumatica Contact → HubSpot Contact Search & Match
        type: action
        args:
          - label: Acumatica Contact
            value: "[Step 26: input]"
          - label: Bussiness Account Id
            value: "[Step 7: input[0].customerID.value]"
      - stepNumber: 28
        name: "Map - Map Contact: Name, Phone & Mobile Logic"
        input: Step 26
        type: map
        code: |-
          // Get all contacts from the Acumatica fetch step
          const contacts = input.iterateKEKC || [];

          // Helper function to safely get value from nested object
          const getValue = (obj) => obj?.value ?? '';

          // Process each contact and return the transformed array
          return contacts.map((contact) => {
            // 1. Determine firstName and lastName
            let firstName = getValue(contact.firstName);
            let lastName = getValue(contact.lastName);

            // If both firstName and lastName are empty, split displayName
            if (!firstName && !lastName) {
              const displayName = getValue(contact.displayName);
              const nameParts = displayName.split(' ');
              firstName = nameParts[0] || '';
              lastName = nameParts.slice(1).join(' ') || '';
            }

            // 2. Determine business phone
            const phone1Type = getValue(contact.phone1Type).toLowerCase();
            const phone2Type = getValue(contact.phone2Type).toLowerCase();
            const phone1Value = getValue(contact.phone1);
            const phone2Value = getValue(contact.phone2);

            let businessPhone = '';
            if (phone1Type.includes('business')) {
              businessPhone = phone1Value;
            } else if (phone2Type.includes('business')) {
              businessPhone = phone2Value;
            }

            // 3. Determine mobile phone
            let mobilePhone = '';
            if (phone1Type === 'cell') {
              mobilePhone = phone1Value;
            } else if (phone2Type === 'cell') {
              mobilePhone = phone2Value;
            }

            // 4. Fallback: if both businessPhone and mobilePhone are empty, use phone1Value or phone2Value
            if (!businessPhone && !mobilePhone && phone1Value) {
              businessPhone = phone1Value;
            } else if (!businessPhone && !mobilePhone && phone2Value) {
              businessPhone = phone2Value;
            }

            // 5. Return the transformed contact object
            return {
              firstName: firstName,
              lastName: lastName,
              email: getValue(contact.email),
              phone: businessPhone,
              mobilePhone: mobilePhone,
              jobTitle: getValue(contact.jobTitle),
              contactID: getValue(contact.contactID),
              displayName: getValue(contact.displayName),
              companyName: getValue(contact.companyName)
            };
          });
