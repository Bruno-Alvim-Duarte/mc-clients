      const acumaticaIndustryClass = input.iterateEIVA?.[0]?.customerClass?.value

      // Build the properties object
      const propertiesObject = {
        name: safeValue(parentName) + " - " + safeValue(locationName) + " - " + safeValue(locationID),
        address: safeValue(addressLine1),
        acumatica_location_id: safeValue(locationID),
        acumatica_customer_id: safeValue(customerID),
        zip: safeValue(zip),
        city: safeValue(city),
        state: safeValue(state),
        country: safeValue(country),
        acumatica_industry_class: safeValue(acumaticaIndustryClass)
      };

      // Return the result with stringified properties
      return [{ properties: JSON.stringify(propertiesObject) }];
