  - stepNumber: 12
    name: Map - Escape & Build Parent Company Properties
    input: Step 7, Step 8
    type: map
    code: |-
      // Get the customer data from input
      const customer = input.iterateEIVA?.[0];
      const mainContact = customer?.mainContact;
      const address = mainContact?.address;

      // Helper function to safely get values and convert null/undefined to empty string
      const safeValue = (val) => val ?? '';

      // Build the properties object with all required fields
      const propertiesObject = {
        name: safeValue(customer?.customerName?.value),
        acumatica_customer_id: safeValue(customer?.customerID?.value),
        phone: safeValue(mainContact?.phone1?.value),
        address: safeValue(address?.addressLine1?.value),
        acumatica_location_id: 'MAIN',
        domain: safeValue(mainContact?.webSite?.value),
        zip: safeValue(address?.postalCode?.value),
        city: safeValue(address?.city?.value),
        state: safeValue(address?.state?.value),
        country: safeValue(address?.country?.value),
        acumatica_industry_class: safeValue(customer?.customerClass?.value)
      };

      // Convert to JSON string using JSON.stringify (automatically handles escaping)
      const propertiesJsonString = JSON.stringify(propertiesObject);

      // Return as array with single output field
      return [{
        properties: propertiesJsonString
      }];
