  - stepNumber: 23
    name: Map - Map Acumatica Fields to HubSpot Deal Update Properties
    input: Step 1, Step 8, Step 14
    results: 1
    type: map
    code: |-
      const acumaticaData = input.mapFZGQ;
      const record = acumaticaData?.[0];
      const hubspotDeal = input.hubspotAppSearchDealsIPOY.length > 0 ? input.hubspotAppSearchDealsIPOY : input.hubspotAppSearchDealsMFIT;
      const hubspotRecord = hubspotDeal?.[0];

      // Helper function to safely escape double quotes in string values
      function safeString(val) {
        if (val === null || val === undefined) return '';
        return String(val).replace(/\"/g, '\\"');
      }

      // Stage ranking for comparison (ascending order, using Acumatica display names)
      const stageRank = {
        'Prospect': 1,
        'Development': 2,
        'Expired': 3,
        'Won': 4,
        'Lost': 5
      };

      // Build a case-insensitive stage rank lookup
      const stageRankNormalized = {};
      for (const [k, v] of Object.entries(stageRank)) {
        stageRankNormalized[k.trim().toUpperCase()] = v;
      }

      // Acumatica stage name to HubSpot internal stage value mapping
      const stageToHubSpot = {
        'Prospect': '1306157229',
        'Development': '1306157230',
        'Expired': '1306157231',
        'Won': 'closedwon',
        'Lost': 'closedlost'
      };

      // Build a case-insensitive stage-to-HubSpot lookup
      const stageToHubSpotNormalized = {};
      for (const [k, v] of Object.entries(stageToHubSpot)) {
        stageToHubSpotNormalized[k.trim().toUpperCase()] = v;
      }

      // Reverse mapping: HubSpot internal stage value to Acumatica stage name (for rank comparison)
      const hubSpotStageToName = {
        '1306157229': 'Prospect',
        '1306157230': 'Development',
        '1306157231': 'Expired',
        'closedwon': 'Won',
        'closedlost': 'Lost'
      };

      // Owner mapping: Acumatica owner name to HubSpot internal owner ID
      const ownerToHubSpot = {
        'TIMOTHY NIX': '7321575',
        'Walter Martinez': '26951785',
        'Ashley Nelson': '80596682',
        'Tara Cabaniss': '80771250',
        'Tamara Wood': '80771273',
        'Britt Cabral': '185671876',
        'Larry Woods': '204240096',
        'Jolene Ramos': '205658988',
        'Jim Whorton': '215835954',
        'Robert Lee': '273828897',
        'Luke Starry': '601051234',
        'Peggy Cole': '690603772',
        'Jeff Patterson': '928040643',
        'Ryan Sperry': '1116181631',
        'Jeff Price': '1215258143',
        'Rachel Motte': '1502551068',
        'Tyler Garza': '1716729933',
        'Chris Barger': '1772285574',
        'Greg Lohse': '1919764494',
        'David Oldham': '1964590240',
        'Chris Hebert': '2086206935'
      };

      // Build a case-insensitive owner lookup from the mapping
      const ownerToHubSpotNormalized = {};
      for (const [k, v] of Object.entries(ownerToHubSpot)) {
        ownerToHubSpotNormalized[k.trim().toUpperCase()] = v;
      }

      // Convert datetime string to epoch milliseconds (Long)
      // Returns null for missing or invalid dates so the field can be omitted
      function toISO(dateStr) {
        if (!dateStr) return null;
        const d = new Date(dateStr);
        return d.toISOString().split('T')[0] + 'T12:00:00.000Z';
      }

      // Determine if we should update the deal stage
      function shouldUpdateStage(acumaticaStage, hubspotStageValue, hubspotOwnerId) {
        // If HubSpot deal has an owner assigned, protect against downgrades
        if (hubspotOwnerId && String(hubspotOwnerId).trim() !== '') {
          const normalizedAcuStage = acumaticaStage.trim().toUpperCase();
          const acumaticaRank = stageRankNormalized[normalizedAcuStage] || 0;
          // Convert HubSpot internal value back to name for rank comparison
          // If HubSpot stage is unrecognized (custom stage, different pipeline, etc.),
          // default to 999 to conservatively block the update and protect the deal
          const hubspotStageName = hubSpotStageToName[hubspotStageValue] || '';
          const hubspotRank = stageRank[hubspotStageName] || 999;
          // Only update if Acumatica stage rank is strictly greater
          return acumaticaRank > hubspotRank;
        }
        // No owner assigned - always allow stage update (existing behavior)
        return true;
      }

      const acumaticaStage = record?.Stage || '';
      const currentHubspotStage = hubspotRecord?.properties?.dealstage || '';
      const hubspotOwnerId = hubspotRecord?.properties?.hubspot_owner_id || '';

      // Map owner name to HubSpot internal ID (case-insensitive, trimmed)
      const acumaticaOwner = record?.Owner_description || '';
      const normalizedOwner = acumaticaOwner.trim().toUpperCase();
      const mappedOwner = ownerToHubSpotNormalized[normalizedOwner] || '';

      // Map stage name to HubSpot internal value (case-insensitive, trimmed)
      const normalizedStage = acumaticaStage.trim().toUpperCase();
      const mappedStage = stageToHubSpotNormalized[normalizedStage] || '';

      const properties = {
        amount: record?.DetailTotal || '',
        dealname: safeString(record?.Description),
        hubspot_owner_id: mappedOwner,
        acumatica_opportunity_id: record?.OpportunityID || ''
      };

      // Only include date fields if they have valid values
      const closedate = toISO(record?.EstimatedCloseDate);
      if (closedate !== null) {
        properties.closedate = closedate;
      }

      const createdate = toISO(record?.DateCreated);
      if (createdate !== null) {
        properties.createdate = createdate;
      }

      // Only include dealstage if we have a valid mapped stage and the update is allowed
      if (mappedStage && shouldUpdateStage(acumaticaStage, currentHubspotStage, hubspotOwnerId)) {
        properties.dealstage = mappedStage;
      }

      return [{ properties }];
  - stepNumber: 24
    name: Map - Resolve HubSpot Deal ID (Primary or Fallback)
    input: Step 8, Step 14
    results: 1
    type: map
    code: |-
      const step3 = input.hubspotAppSearchDealsIPOY; // Step 3 - Search HubSpot Deals by Acumatica Opportunity ID
      const step8 = input.hubspotAppSearchDealsMFIT; // Step 8 - Search HubSpot Deals by HSDEALID (Fallback)

      const dealId = step3?.[0]?.id || step8?.[0]?.id || '';

      return [{ dealId }];
  - stepNumber: 25
