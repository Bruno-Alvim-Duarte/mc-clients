  - stepNumber: 29
    name: Map - Build Deal Associations
    input: Step 21, Step 18
    results: 1
    type: map
    code: |-
      const companyId = input.hubspotAppSearchCompaniesVFAI?.[0]?.id || '';
      const contactId = input.hubspotAppSearchContactsO6W7?.[0]?.id || '';

      const associations = [];

      // Always add Company association if available
      if (companyId) {
        associations.push({
          to: { id: companyId },
          types: [{ associationCategory: 'HUBSPOT_DEFINED', associationTypeId: '341' }]
        });
      }

      // Only add Contact association if Contact was found
      if (contactId) {
        associations.push({
          to: { id: contactId },
          types: [{ associationCategory: 'HUBSPOT_DEFINED', associationTypeId: '3' }]
        });
      }

      return [{ associations }];
