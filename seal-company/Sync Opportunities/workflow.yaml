  - stepNumber: 1
    name: Map - Extract Opportunity Fields from Webhook
    input: IWoMk9HLY6sI
    results: 1
    type: map
    code: |-
      const webhookData = input.webhookY6SI;

      // Extract the inserted data from the webhook body
      const insertedData = webhookData?.[0]?.body?.Inserted?.[0];

      // Return an array with all fields from the inserted data
      return [{
        OpportunityID: insertedData?.OpportunityID?.trim(),
        BusinessAccount: insertedData?.BusinessAccount?.trim(),
        Contact: insertedData?.Contact,
        Owner: insertedData?.Owner,
        Stage: insertedData?.Stage,
        DetailTotal: insertedData?.DetailTotal,
        EstimatedCloseDate: insertedData?.EstimatedCloseDate,
        DateCreated: insertedData?.DateCreated,
        LastModifiedDate: insertedData?.LastModifiedDate,
        CROpportunity_noteID: insertedData?.CROpportunity_noteID,
        Description: insertedData?.Description,
        Owner_description: insertedData?.Owner_2
      }];
  - stepNumber: 2
    name: "If/Else - Check: Is This a Deletion? (No Inserted Data)"
    results: 1
    type: conditional
    condition: "[Step 1: input[0].OpportunityID] empty null"
  - stepNumber: 3
    name: "Flow Control - End Workflow: Deletion Event — Skip Processing"
    type: action
    args:
      - label: Action
        value: endAsSuccess
      - label: Emit Log
        value: "true"
      - label: Log Type
        value: info
      - label: Log Message
        value: "Skipping workflow: Acumatica opportunity was deleted (no Ins..."
  - stepNumber: 4
    name: "Map - Detect Loop: Check if Only USRHSDEALID Changed"
    input: IWoMk9HLY6sI
    results: 1
    type: map
    code: |-
      const webhookData = input.webhookY6SI;

      const body = webhookData?.[0]?.body;
      const inserted = body?.Inserted?.[0];
      const deleted = body?.Deleted?.[0];

      // If there's no Deleted record, it's a new creation — not a loop
      if (!deleted || !inserted) {
        return [{ isLoopEcho: false }];
      }

      // Fields to ignore when comparing (these change on any update)
      const ignoreFields = [
        'LastModifiedDate',
        'LastModified',
        'LastActivity',
        'CompletedAt',
        'CreatedAt',
        'Timestamp',
        'tstamp',
        'NoteID',
        'UsrHSDealID'
      ];

      // Normalize: remove ignored fields and HSDEALID from attributes
      function normalize(record) {
        const clone = JSON.parse(JSON.stringify(record));
        
        // Remove top-level ignored fields (case-insensitive)
        for (const key of Object.keys(clone)) {
          if (ignoreFields.some(f => key.toLowerCase().includes(f.toLowerCase()))) {
            delete clone[key];
          }
        }
        
        return clone;
      }

      const normalizedInserted = normalize(inserted);
      const normalizedDeleted = normalize(deleted);

      const isLoopEcho = JSON.stringify(normalizedInserted) === JSON.stringify(normalizedDeleted);

      return [{ isLoopEcho }];
  - stepNumber: 5
    name: "If/Else - Check: Is This a Loop Echo?"
    results: 1
    type: conditional
    condition: "[Step 4: input[0].isLoopEcho] = true"
  - stepNumber: 6
    name: "Flow Control - End Workflow: Loop Echo Detected (HSDEALID Only Change)"
