workflow:
  name: Amazon FBA to NetSuite - FBA Invoice Sync
  id: AQIIbHK1mcx3
  version: draft
  isActive: true
  publishedOn: 2026-08-11T17:18:26.000Z
triggers:
  - name: Schedule - Run every 30 minutes, daily
    type: schedule
    message: Run every 30 minutes, daily
    schedule:
      mode: interval
      days:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
      dayNames:
        - Sunday
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
      intervalMs: 1800000
steps:
  - stepNumber: 1
    name: Map - Map - Read Memory State and Retry Queue
    input: No data imported
    results: 1
    type: map
    code: |
      const memory = input.memory?.environment || input.memory || {};
      const checkpointKey = 'lionel_fba_invoice_sync_checkpoint';
      const retryQueueKey = 'lionel_fba_invoice_retry_orders';

      function parseArray(value) {
        if (!value) return [];
        if (Array.isArray(value)) return value;
        if (typeof value === 'string') {
          try {
            const parsed = JSON.parse(value);
            return Array.isArray(parsed) ? parsed : [];
          } catch (_) { return []; }
        }
        return [];
      }

      function parseObject(value) {
        if (!value) return {};
        if (typeof value === 'string') {
          try {
            const parsed = JSON.parse(value);
            return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
          } catch (_) { return {}; }
        }
        return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
      }

      const checkpoint = parseObject(memory[checkpointKey]);
      const retryOrders = parseArray(memory[retryQueueKey])
        .map(record => ({
          ...record,
          amazonOrderId: String(record.amazonOrderId || record.orderId || '').trim()
        }))
        .filter(record => record.amazonOrderId);

      return [{
        checkpoint,
        retryOrders,
        retryOrderIds: Array.from(new Set(retryOrders.map(r => r.amazonOrderId))),
        keys: {
          checkpointKey,
          retryQueueKey
        }
      }];
  - stepNumber: 2
    name: Map - Map - Runtime Config and Amazon Query
    input: Step 1
    results: 1
    type: map
    code: |
      const state = input['map3HMU']?.[0] || {};
      const checkpoint = state.checkpoint || {};
      const updatedAfter = checkpoint.lastUpdatedAfter || '2026-05-01T00:00:00';
      const wfArguments = input["workflowArguments"]
      const defaultSkuTranslationExceptions = {
        '203-stickerless': '203',
        '203Merchant Barcode': '203',
        '424': '424E',
        '470AF': '470',
        '489': '489E',
        'YZ-O27H-G3TU': '811'
      };

      return [{
        workflowName: 'Amazon FBA to NetSuite - FBA Invoice Sync',
        recipients: 'bruno@mindcloud.co',
        region: 'North America',
        marketplaceScope: 'All marketplaces',
        orderStatus: 'Shipped',
        fulfillmentChannel: 'AFN',
        updatedAfter,
        updatedBefore: input.system?.nowIso || new Date().toISOString(),
        pageSize: 50,
        retryOrders: state.retryOrders || [],
        retryOrderIds: state.retryOrderIds || [],
        checkpointKey: state.keys?.checkpointKey || 'lionel_fba_invoice_sync_checkpoint',
        retryQueueKey: state.keys?.retryQueueKey || 'lionel_fba_invoice_retry_orders',
        missingSkuBatchAlertKey: 'lionel_fba_invoice_missing_sku_batch_alert',
        skuTranslationExceptions: {
          ...defaultSkuTranslationExceptions,
          ...(wfArguments.skuTranslationExceptions || {})
        },
        batchId: input.system?.nowIso || new Date().toISOString(),
        netsuite: {
          customerInternalId: wfArguments.customerID,
          customerName: '9561387706 Amazon Customer',
          subsidiary: '3',
          divisionFieldId: 'csegdivision',
          division: wfArguments.divisionID,
          class: wfArguments.classID,
          department: '34',
          location: '152',
          shipmethod: '47311'
        },
        chargeItems: {
          giftWrap: wfArguments.giftWrapItemID,
          promotionDiscount: wfArguments?.discountItemID
        }
      }];
  - stepNumber: 3
    name: Amazon Seller - Amazon - Get Recently Updated Shipped FBA Orders
    results: 50
    type: action
    args:
      - label: Order Status
        value: "[Step 2: input[0].orderStatus]"
      - label: Last Updated After
        value: "[Step 2: input[0].updatedAfter]"
      - label: Last Updated Before
        value: "[Step 2: input[0].updatedBefore]"
  - stepNumber: 4
    name: Map - Map - Retry Orders To Fetch
    input: Step 2
    results: 416
    type: map
    code: |-
      const config = input['map9QOY']?.[0] || {};
      const seen = new Set();
      return (config.retryOrders || []).filter(record => {
        const id = String(record.amazonOrderId || '').trim();
        if (!id || seen.has(id)) return false;
        seen.add(id);
        return true;
      });
  - stepNumber: 5
    name: Iterate - Iterate - Loop through Retry Orders To Fetch
    results: 1
    type: loop
    loopTarget:
      stepNumber: 4
      name: Map - Map - Retry Orders To Fetch
    children:
      - stepNumber: 6
        name: Amazon Seller - Amazon - Get Retry FBA Order by Order Id
        results: 1
        type: action
        args:
          - label: Order Id
            value: "[Step 5: input[0].amazonOrderId]"
  - stepNumber: 7
    name: Group Results - Group - Group Retry FBA Orders by Order Id
    results: 3
    type: action
    args:
      - label: Flatten Results
        value: Yes
  - stepNumber: 8
    name: Map - Map - Merge and Deduplicate Amazon Orders
    input: Step 1, Step 2, Step 3, Step 7
    results: 53
    type: map
    code: |
      const config = input['map9QOY']?.[0] || {};
      const currentOrders = input['amazonSellerListOrdersKFHW'] || [];
      const groupedRetryOrderResults = input['groupResults4EHS'] || [];

      function parseArray(value) {
        if (!value) return [];
        if (Array.isArray(value)) return value;
        if (typeof value === 'string') {
          try {
            const parsed = JSON.parse(value);
            return Array.isArray(parsed) ? parsed : [];
          } catch (_) { return []; }
        }
        return [];
      }

      function orderId(sourceOrder) {
        return String(
          sourceOrder?.AmazonOrderId ||
          sourceOrder?.amazonOrderId ||
          sourceOrder?.id ||
          ''
        ).trim();
      }

      function collectOrders(value, collected = []) {
        if (!value) return collected;

        if (typeof value === 'string') {
          collectOrders(parseArray(value), collected);
          return collected;
        }

        if (Array.isArray(value)) {
          for (const item of value) collectOrders(item, collected);
          return collected;
        }

        if (typeof value !== 'object') return collected;

        if (orderId(value)) {
          collected.push(value);
          return collected;
        }

        const wrapperKeys = [
          'results',
          'result',
          'response',
          'responses',
          'amazonSellerGetOrderGSDY',
          'data',
          'output',
          'outputs',
          'items',
          'orders',
          'Order',
          'Orders'
        ];

        for (const key of wrapperKeys) {
          if (value[key]) collectOrders(value[key], collected);
        }

        return collected;
      }

      const retryIds = new Set(
        (config.retryOrderIds || [])
          .map(id => String(id || '').trim())
          .filter(Boolean)
      );

      const retryCacheById = new Map();
      const groupedRetryOrders = collectOrders(groupedRetryOrderResults);

      for (const order of groupedRetryOrders) {
        const id = orderId(order);
        if (!id || !retryIds.has(id)) continue;

        retryCacheById.set(id, order);
      }

      const retrySources = Array.from(retryCacheById.values());
      const byId = new Map();

      for (const sourceOrder of currentOrders) {
        const id = orderId(sourceOrder);
        if (!id) continue;

        const status = String(
          sourceOrder.OrderStatus ||
          sourceOrder.orderStatus ||
          ''
        ).toLowerCase();

        const channel = String(
          sourceOrder.FulfillmentChannel ||
          sourceOrder.fulfillmentChannel ||
          ''
        ).toUpperCase();

        if (status && status !== 'shipped') continue;
        if (channel && channel !== 'AFN') continue;

        byId.set(id, {
          ...sourceOrder,
          AmazonOrderId: id,
          isRetry: retryIds.has(id) || Boolean(sourceOrder.isRetry),
        });
      }

      for (const sourceOrder of retrySources) {
        const id = orderId(sourceOrder);
        if (!id) continue;

        const status = String(
          sourceOrder.OrderStatus ||
          sourceOrder.orderStatus ||
          ''
        ).toLowerCase();

        const channel = String(
          sourceOrder.FulfillmentChannel ||
          sourceOrder.fulfillmentChannel ||
          ''
        ).toUpperCase();

        if (status && status !== 'shipped') continue;
        if (channel && channel !== 'AFN') continue;

        byId.set(id, {
          ...sourceOrder,
          AmazonOrderId: id,
          isRetry: true,
        });
      }

      return Array.from(byId.values()).sort((a, b) =>
        Number(Boolean(b.isRetry)) - Number(Boolean(a.isRetry)) ||
        String(a.LastUpdateDate || a.lastUpdateDate || '').localeCompare(
          String(b.LastUpdateDate || b.lastUpdateDate || '')
        ) ||
        String(a.AmazonOrderId).localeCompare(String(b.AmazonOrderId))
      );
  - stepNumber: 9
    name: Iterate - Iterate - Loop through Amazon FBA Orders
    type: loop
    loopTarget:
      stepNumber: 8
      name: Map - Map - Merge and Deduplicate Amazon Orders
    children:
      - stepNumber: 10
        name: Amazon Seller - Amazon - Get Order Items
        type: action
        args:
          - label: Order Id
            value: "[Step 9: input[0].amazonOrderId]"
      - stepNumber: 11
        name: Map - Map - Normalize Amazon Order
        input: Step 2, Step 9, Step 10
        results: 1
        type: map
        code: |-
          const config = input['map9QOY']?.[0] || {};
          const order = input['iterate7INU']?.[0] || {};
          const raw = input['amazonSellerGetOrderItemsNFJ8'] || [];

          const itemRows = raw.flatMap(x =>
            Array.isArray(x?.OrderItems) ? x.OrderItems :
            Array.isArray(x?.orderItems) ? x.orderItems :
            Array.isArray(x?.items) ? x.items :
            Array.isArray(x) ? x : [x]
          ).filter(Boolean);

          const money = v => Number(v?.Amount ?? v?.amount ?? v ?? 0) || 0;
          const round = n => Math.round((Number(n) || 0) * 100) / 100;
          const amazonOrderId = String(order.AmazonOrderId || order.amazonOrderId || '').trim();

          const lines = itemRows.map(item => {
            const quantity = Number(item.QuantityOrdered ?? item.quantityOrdered ?? item.QuantityShipped ?? item.quantity ?? 0) || 0;
            return {
              amazonOrderItemId: String(item.OrderItemId || item.orderItemId || ''),
              sku: String(item.SellerSKU || item.sellerSKU || item.SKU || item.sku || '').trim(),
              title: item.Title || item.title || '',
              asin: item.ASIN || item.asin || '',
              quantity,
              itemPrice: round(money(item.ItemPrice || item.itemPrice)),
              itemTax: round(money(item.ItemTax || item.itemTax)),
              shippingPrice: round(money(item.ShippingPrice || item.shippingPrice)),
              shippingTax: round(money(item.ShippingTax || item.shippingTax)),
              shippingDiscount: round(money(item.ShippingDiscount || item.shippingDiscount)),
              promotionDiscount: round(money(item.PromotionDiscount || item.promotionDiscount)),
              giftWrapPrice: round(money(item.GiftWrapPrice || item.giftWrapPrice)),
              giftWrapTax: round(money(item.GiftWrapTax || item.giftWrapTax))
            };
          }).filter(line => line.quantity > 0);

          const validationErrors = [];
          if (!amazonOrderId) validationErrors.push('Missing AmazonOrderId.');
          if (!lines.length) validationErrors.push(`No order items returned for Amazon order ${amazonOrderId || '(unknown)'}.`);
          for (const line of lines) {
            if (!line.sku) validationErrors.push(`Missing Seller SKU for Amazon order item ${line.amazonOrderItemId || '(unknown)'}.`);
            if (line.itemPrice === 0) validationErrors.push(`Zero item price for SKU ${line.sku || '(missing sku)'}.`);
          }

          return [{
            amazonOrderId,
            marketplaceId: order.MarketplaceId || order.marketplaceId || null,
            purchaseDate: order.PurchaseDate || order.purchaseDate || null,
            lastUpdateDate: order.LastUpdateDate || order.lastUpdateDate || null,
            currency: order.OrderTotal?.CurrencyCode || order.orderTotal?.currencyCode || itemRows[0]?.ItemPrice?.CurrencyCode || null,
            isRetry: Boolean(order.isRetry),
            customerInternalId: config.netsuite.customerInternalId,
            lines,
            validationErrors,
            hasRequiredData: validationErrors.length === 0
          }];
      - stepNumber: 12
        name: If/Else - If/Else - Order Has Required Data
        results: 1
        type: conditional
        condition: "[Step 11: input[0].hasRequiredData] = true"
        branches:
          "false":
            - stepNumber: 34
              name: Map - Map - Build Invalid Order Alert
              input: Step 2, Step 11
              results: 1
              type: map
              code: |-
                const config = input['map9QOY']?.[0] || {};
                const order = input['mapQC7W']?.[0] || {};

                return [{
                  to: config.recipients,
                  subject: `Amazon FBA to NetSuite - FBA Invoice Sync - Invalid order ${order.amazonOrderId || '(unknown)'}`,
                  body: `Amazon FBA order ${order.amazonOrderId || '(unknown)'} could not be normalized and was added to retry memory.\n\nReason(s):\n${(order.validationErrors || []).map(e => '- ' + e).join('\n')}\n\nNo NetSuite invoice was created.`
                }];
            - stepNumber: 35
              name: "Flow Control - Flow Control - Skip: Invalid Amazon Order"
              results: 1
              type: action
              args:
                - label: Action
                  value: doNothing
                - label: Emit Log
                  value: Yes
                - label: Log Type
                  value: warning
                - label: Log Message
                  value: "[Amazon] Skipped Amazon FBA order "
                - label: Send Email
                  value: Yes
                - label: Email To
                  value: "[Step 34: input[0].to]"
                - label: Email Subject
                  value: "[Step 34: input[0].subject]"
                - label: Email Body
                  value: "[Step 34: input[0].body]"
          "true":
            - stepNumber: 13
              name: Netsuite - NetSuite - Find Existing Invoice
              type: action
            - stepNumber: 14
              name: If/Else - If/Else - No Existing Invoice
              results: 1
              type: conditional
              condition: "[Step 13: response[0].id] empty null"
              branches:
                "false":
                  - stepNumber: 33
                    name: "Flow Control - Flow Control - Skip: Existing Invoice"
                    type: action
                    args:
                      - label: Action
                        value: doNothing
                      - label: Emit Log
                        value: Yes
                      - label: Log Type
                        value: info
                      - label: Log Message
                        value: "[NetSuite] Found existing invoice "
                "true":
                  - stepNumber: 15
                    name: Netsuite - NetSuite - Resolve Invoice Items by SKU
                    results: 1
                    type: action
                  - stepNumber: 16
                    name: Map - Map - Build NetSuite Invoice Payload
                    input: Step 2, Step 11, Step 15
                    results: 1
                    type: map
                    code: |
                      const config = input['map9QOY']?.[0] || {};
                      const order = input['mapQC7W']?.[0] || {};
                      const resolved = input['netsuiteExecuteCustomCode0OJ2']?.[0] || {};
                      
                      const round = n => Math.round((Number(n) || 0) * 100) / 100;
                      const isPlaceholder = v => !v || String(v).startsWith('{{');
                      
                      function toDateOnly(value) {
                        if (!value) return null;
                      
                        const raw = String(value).trim();
                        const firstTen = raw.slice(0, 10);
                      
                        if (
                          firstTen.length === 10 &&
                          firstTen.charAt(4) === '-' &&
                          firstTen.charAt(7) === '-'
                        ) {
                          return firstTen;
                        }
                      
                        const date = new Date(value);
                        if (Number.isNaN(date.getTime())) return null;
                      
                        return date.toISOString().slice(0, 10);
                      }
                      
                      function firstDayOfMonthDateOnly(value) {
                        const dateOnly = toDateOnly(value);
                        if (!dateOnly) return null;
                      
                        return `${dateOnly.slice(0, 7)}-01`;
                      }
                      
                      const amazonPurchaseDate = toDateOnly(order.purchaseDate);
                      const fallbackTranDate = firstDayOfMonthDateOnly(
                        input.system?.nowIso || new Date().toISOString()
                      );
                      const memoParts = [`Amazon FBA order ${order.amazonOrderId}`];
                      
                      if (amazonPurchaseDate) {
                        memoParts.push(`Amazon order date ${amazonPurchaseDate}`);
                      }
                      
                      const itemLines = (resolved.matched || []).map(line => ({
                        kind: 'amazon_item',
                        sku: line.sku,
                        amazonSku: line.amazonSku || line.sku,
                        netsuiteSearchSku: line.netsuiteSearchSku || line.netsuiteItemSku,
                        skuMatchStrategy: line.skuMatchStrategy || '',
                        skuSearchAttempts: line.skuSearchAttempts || [],
                        title: line.title,
                        itemInternalId: line.netsuiteItemId,
                        itemType: line.netsuiteItemType,
                        quantity: line.quantity,
                        rate: round(line.itemPrice / Math.max(line.quantity, 1)),
                        amount: round(line.itemPrice),
                        amazonOrderItemId: line.amazonOrderItemId,
                        requiredQuantityAtLocation: line.requiredQuantityAtLocation,
                        availableQuantityAtLocation: line.availableQuantityAtLocation,
                        inventoryLocationId: line.inventoryLocationId,
                        inventoryAvailabilitySource: line.inventoryAvailabilitySource,
                      }));
                      
                      const totals = (order.lines || []).reduce(
                        (acc, line) => {
                          acc.shipping += line.shippingPrice || 0;
                          acc.shippingTax += line.shippingTax || 0;
                          acc.itemTax += line.itemTax || 0;
                          acc.giftWrap += line.giftWrapPrice || 0;
                          acc.giftWrapTax += line.giftWrapTax || 0;
                          acc.discounts +=
                            (line.promotionDiscount || 0) +
                            (line.shippingDiscount || 0);
                      
                          return acc;
                        },
                        {
                          shipping: 0,
                          shippingTax: 0,
                          itemTax: 0,
                          giftWrap: 0,
                          giftWrapTax: 0,
                          discounts: 0,
                        }
                      );
                      
                      const shippingCost = round(totals.shipping);
                      
                      const chargeLines = [];
                      const missingChargeMappings = [];
                      
                      function addCharge(kind, itemId, amount, description) {
                        const rounded = round(amount);
                      
                        if (Math.abs(rounded) < 0.005) return;
                      
                        if (isPlaceholder(itemId)) {
                          missingChargeMappings.push(kind);
                          return;
                        }
                      
                        chargeLines.push({
                          kind,
                          itemInternalId: String(itemId),
                          quantity: 1,
                          rate: rounded,
                          amount: rounded,
                          description,
                        });
                      }
                      
                      addCharge(
                        'giftWrap',
                        config.chargeItems.giftWrap,
                        totals.giftWrap,
                        `Amazon gift wrap for order ${order.amazonOrderId}`
                      );
                      
                      addCharge(
                        'promotionDiscount',
                        config.chargeItems.promotionDiscount,
                        -Math.abs(totals.discounts),
                        `Amazon discounts for order ${order.amazonOrderId}`
                      );
                      
                      const validationErrors = [];
                      const missingSkuDetails = (resolved.missingSkuDetails || []).map(line => ({
                        sku: String(line.sku || '').trim(),
                        amazonSku: String(line.amazonSku || line.sku || '').trim(),
                        netsuiteSearchSku: String(line.netsuiteSearchSku || line.sku || '').trim(),
                        skuMatchStrategy: line.skuMatchStrategy || '',
                        skuSearchAttempts: line.skuSearchAttempts || [],
                        amazonOrderId: order.amazonOrderId,
                        marketplaceId: order.marketplaceId || null,
                        purchaseDate: order.purchaseDate || null,
                        lastUpdateDate: order.lastUpdateDate || null,
                        amazonOrderItemId: line.amazonOrderItemId || '',
                        title: line.title || '',
                        asin: line.asin || '',
                        quantity: Number(line.quantity || 0) || 0
                      })).filter(line => line.sku);
                      const inventoryShortageDetails = (resolved.inventoryShortages || []).map(line => ({
                        sku: String(line.sku || line.netsuiteItemSku || '').trim(),
                        amazonSku: String(line.amazonSku || line.sku || '').trim(),
                        netsuiteSearchSku: String(line.netsuiteSearchSku || line.netsuiteItemSku || '').trim(),
                        skuMatchStrategy: line.skuMatchStrategy || '',
                        skuSearchAttempts: line.skuSearchAttempts || [],
                        netsuiteItemId: String(line.netsuiteItemId || '').trim(),
                        netsuiteItemName: line.netsuiteItemName || '',
                        amazonOrderId: order.amazonOrderId,
                        marketplaceId: order.marketplaceId || null,
                        purchaseDate: order.purchaseDate || null,
                        lastUpdateDate: order.lastUpdateDate || null,
                        requiredQuantity: Number(line.requiredQuantity || 0) || 0,
                        availableQuantity: Number(line.availableQuantity || 0) || 0,
                        shortageQuantity: Number(line.shortageQuantity || 0) || 0,
                        locationId: line.locationId || resolved.inventoryLocationId || config.netsuite.location || '',
                        source: line.source || ''
                      })).filter(line => line.sku || line.netsuiteItemId);
                      
                      if (!resolved.hasAllItems) {
                        validationErrors.push(
                          `Missing NetSuite item SKUs: ${(resolved.missingSkus || []).join(', ') || 'none'}; duplicate NetSuite item SKUs: ${(resolved.duplicateSkus || []).join(', ') || 'none'}. The resolver first searches the exact Amazon SKU, then the base SKU, then base SKU + M, then configured exceptions.`
                        );
                      }
                      
                      if (resolved.inventoryCheckErrors && resolved.inventoryCheckErrors.length) {
                        validationErrors.push(
                          `NetSuite inventory availability check failed: ${resolved.inventoryCheckErrors.join('; ')}.`
                        );
                      }
                      
                      if (resolved.inventoryShortages && resolved.inventoryShortages.length) {
                        validationErrors.push(
                          `Insufficient NetSuite inventory at location ${resolved.inventoryLocationId || config.netsuite.location}: ${resolved.inventoryShortages.map(line =>
                            `SKU ${line.sku || line.netsuiteItemSku || line.netsuiteItemId} requires ${line.requiredQuantity}, available ${line.availableQuantity}, shortage ${line.shortageQuantity}`
                          ).join('; ')}.`
                        );
                      }
                      
                      if (missingChargeMappings.length) {
                        validationErrors.push(
                          `Missing NetSuite charge item mappings: ${missingChargeMappings.join(', ')}.`
                        );
                      }
                      
                      if (!itemLines.length) {
                        validationErrors.push('No invoice item lines were created.');
                      }
                      
                      const hasMissingNetSuiteSkus = missingSkuDetails.length > 0;
                      const hasInventoryShortages = inventoryShortageDetails.length > 0;
                      const hasDuplicateNetSuiteSkus = Boolean(resolved.duplicateSkus && resolved.duplicateSkus.length);
                      const hasInventoryCheckErrors = Boolean(resolved.inventoryCheckErrors && resolved.inventoryCheckErrors.length);
                      const hasMissingChargeMappings = missingChargeMappings.length > 0;
                      const missingOnlyNoItemLines = hasMissingNetSuiteSkus && !itemLines.length;
                      const hasBatchValidationAlerts = hasMissingNetSuiteSkus || hasInventoryShortages;
                      const hasNonMissingSkuValidationErrors =
                        hasDuplicateNetSuiteSkus ||
                        hasInventoryCheckErrors ||
                        hasMissingChargeMappings ||
                        (!itemLines.length && !missingOnlyNoItemLines);
                      const shouldDeferBatchValidationEmail = hasBatchValidationAlerts && !hasNonMissingSkuValidationErrors;
                      
                      return {
                        canCreate: validationErrors.length === 0,
                        validationErrors,
                        hasMissingNetSuiteSkus,
                        hasInventoryShortages,
                        hasBatchValidationAlerts,
                        hasNonMissingSkuValidationErrors,
                        shouldDeferMissingSkuEmail: shouldDeferBatchValidationEmail,
                        shouldDeferBatchValidationEmail,
                        missingSkuDetails,
                        inventoryShortageDetails,
                        amazonOrderId: order.amazonOrderId,
                        externalId: order.amazonOrderId,
                        entity: config.netsuite.customerInternalId,
                        subsidiary: config.netsuite.subsidiary,
                        divisionFieldId: config.netsuite.divisionFieldId,
                        division: config.netsuite.division,
                        department: config.netsuite.department,
                        class: config.netsuite.class,
                        location: config.netsuite.location,
                        shipmethod: config.netsuite.shipmethod,
                        tranDate: amazonPurchaseDate,
                        fallbackTranDate,
                        originalAmazonPurchaseDate: order.purchaseDate || null,
                        originalAmazonPurchaseDateOnly: amazonPurchaseDate,
                        memo: memoParts.join(' | '),
                        otherRefNum: order.amazonOrderId,
                        marketplaceId: order.marketplaceId,
                        currency: order.currency,
                        inventoryLocationId: resolved.inventoryLocationId || config.netsuite.location,
                        inventoryShortages: resolved.inventoryShortages || [],
                        inventoryCheckErrors: resolved.inventoryCheckErrors || [],
                        inventoryCheckSkipped: resolved.inventoryCheckSkipped || [],
                        shippingCost,
                        itemLines,
                        chargeLines,
                        totals,
                      };
                  - stepNumber: 17
                    name: If/Else - If/Else - Invoice Payload Can Be Created
                    results: 1
                    type: conditional
                    condition: "[Step 16: input[0].canCreate] = true"
                    branches:
                      "false":
                        - stepNumber: 26
                          name: Map - Map - Build Mismatch Alert
                          input: Step 2, Step 11, Step 16
                          results: 1
                          type: map
                          code: |
