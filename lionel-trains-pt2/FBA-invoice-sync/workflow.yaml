        );
      
      const orderIds = Array.from(new Set(
        [
          ...sortedSkus.flatMap(record =>
            record.orders.map(order => String(order.amazonOrderId || '').trim()).filter(Boolean)
          ),
          ...sortedInventoryShortages.flatMap(record =>
